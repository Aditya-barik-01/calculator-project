<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cal.css">
    <title>calculator</title>
</head>
<body>
    <div id="mainDiv">
        <div id="smallDiv">
            <input type="text" name="" id="screen" placeholder="0">

        <div id="buttonDiv">
            <div class="button">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="butcol">/</button>
            </div>

            <div class="button">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="butcol">*</button>
            </div> 

            <div class="button">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="butcol">-</button>
            </div>

            <div class="button">
            <button class="butcol">0</button>
            <button class="butcol">.</button>
            <button class="butcol">+</button>
            <button class="butcol">=</button>
             </div>
        </div>

        </div>
    </div>
</body>
</html>
